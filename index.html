function isTokenValid() { return _accessToken && Date.now() < _tokenExpiresAt - 60000; }

function waitForGsi() {
    return new Promise(function(resolve) {

function encodeRfc2047(text) {
    var enc = new TextEncoder();
    var bytes = enc.encode(text);
    var bin = '';
    bytes.forEach(function(b) { bin += String.fromCharCode(b); });
    return '=?UTF-8?B?' + btoa(bin) + '?=';
}
function encodeBase64Body(text) {
    var enc = new TextEncoder();
    var bytes = enc.encode(text);
    var bin = '';
    bytes.forEach(function(b) { bin += String.fromCharCode(b); });
    return btoa(bin);
}
function base64UrlEncode(str) {
    // TextEncoder로 안전하게 UTF-8 바이트 변환 후 base64url 인코딩
    var enc = new TextEncoder();
    var bytes = enc.encode(str);
    var bin = '';
    bytes.forEach(function(b) { bin += String.fromCharCode(b); });
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function sendViaGmailAPI(to, subject, bodyText, pdfBlob, filename) {
    return pdfBlob.arrayBuffer().then(function(buf) {
        var bytes = new Uint8Array(buf);
        var pdfBin = '';
        bytes.forEach(function(b) { pdfBin += String.fromCharCode(b); });
        var pdfB64 = btoa(pdfBin);
        var boundary = 'rf_' + Date.now();
        var mime = [
            'MIME-Version: 1.0',
            'To: ' + to,
            'Subject: ' + encodeRfc2047(subject),
            'Content-Type: multipart/mixed; boundary="' + boundary + '"',
            '',
            '--' + boundary,
            'Content-Type: text/plain; charset=UTF-8',
            'Content-Transfer-Encoding: base64',
            '',
            encodeBase64Body(bodyText),
            '',
            '--' + boundary,
            'Content-Type: application/pdf; name="' + encodeRfc2047(filename) + '"',
            'Content-Transfer-Encoding: base64',
            'Content-Disposition: attachment; filename="' + encodeRfc2047(filename) + '"',
            '',
            pdfB64,
            '',
            '--' + boundary + '--'
        ].join('\r\n');
        var raw = base64UrlEncode(mime);
        return fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + _accessToken, 'Content-Type': 'application/json' },
            body: JSON.stringify({ raw: raw })
        });
    }).then(function(res) {
        if (!res.ok) return res.json().then(function(err) { throw new Error(err.error && err.error.message || '전송 실패'); });
        return res.json();
    });
}

function formatDate(date) {
    var y=date.getFullYear(), m=String(date.getMonth()+1).padStart(2,'0'), d=String(date.getDate()).padStart(2,'0');

}

    var y=String(date.getFullYear()).slice(-2), m=String(date.getMonth()+1).padStart(2,'0'), d=String(date.getDate()).padStart(2,'0');
    return y+'.'+m+'.'+d;

function getTripPeriodString(dr) {
    var s = (dr || '').replace(/\s+/g, '').replace(/\.~/g, '~');
    if (s.endsWith('.')) s = s.slice(0, -1);
    var parts = s.split('~');
    if (parts.length === 2 && parts[0] === parts[1]) return parts[0];
    return s || formatShortDate(new Date());
}

    function buildPdfBlob(){
        if(pageJpegsRef.current.length)return Promise.resolve(buildPdfFromPages(pageJpegsRef.current));
        var perPage=4,total=Math.ceil(images.length/perPage),pages=[];
        var chain=Promise.resolve();
        for(var p=0;p<total;p++){
            (function(pageNum){chain=chain.then(function(){

                    pages.push(canvas.toDataURL('image/jpeg',0.75));

            });})(p);
        }
        return chain.then(function(){return buildPdfFromPages(pages);});
    }

            onSave:function(newSrc){setImages(function(prev){return prev.map(function(img){return img.id===croppingImg.id?Object.assign({},img,{src:newSrc}):img;});});setCroppingImg(null);showMessage('영역이 수정되었습니다.','success');},
            onCancel:function(){setCroppingImg(null);}
        })
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App,null));
</script>
</body>
</html>
